<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>映画を追加する</title>
</head>
<body>
    <h2>映画新規登録</h2>
    <form action="/movie_add">
        <label>ID: <input type="number" name="id" required></label><br>
        <label>タイトル: <input type="text" name="name" required></label><br>
        <label>日本公開日: <input type="text" name="birthday" placeholder="YY/MM/DD"></label><br>
        <label>上映時間（分）: <input type="text" name="time"></label><br>
        <label>次作・続編: <input type="text" name="next"></label><br>
        <input type="submit" value="登録">
    </form>
    <br>
    <a href="/movie">一覧に戻る</a>
</body>
</html>
